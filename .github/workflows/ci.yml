name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Real-DB claim-path integration smoke (MV-18). Runs the `*.itest.ts` suite
  # against a full local Supabase stack (Postgres + GoTrue auth + PostgREST), so it
  # exercises constraints the mocked unit tests structurally cannot (e.g. the
  # partial-unique index assessments_primary_idx behind the MV-16 regression).
  # Separate job: the Docker stack startup is slow and must not gate the fast
  # validate lane.
  #
  # GATING since 2026-08-03 (was `continue-on-error: true` while the flake rate was
  # unmeasured). It has now been measured: across PRs #95-#110 this job ran ~12 times
  # and failed once, on #102 — a true positive (a stale assertion), not a flake.
  #
  # The flag had to go because MV-153 put the cross-tenant authorization matrix in
  # this lane: advisory, a tenant-isolation regression turned the job red and merged
  # anyway, which is the exact assurance-instead-of-evidence posture that card exists
  # to end. A red run here must now block.
  #
  # The other half, OUTSIDE this file, is now done too: the "master protection"
  # repository ruleset (active, no bypass) requires `integration` and `validate` as
  # status checks, strict/up-to-date. Removing the flag makes the workflow run fail;
  # the ruleset is what makes a failed run un-mergeable.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20: supabase-js realtime needs native WebSocket, which Node
      # 20 lacks — the itest fails there with "Node.js 20 detected without
      # native WebSocket support". The fast validate lane stays on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # ubuntu-latest ships Docker preinstalled; `supabase start` brings up the
      # full stack and applies every migration in supabase/migrations.
      - name: Start Supabase
        run: npx supabase start
      # Export the local stack's URL + service-role key + ANON key as the env vars
      # the smoke reads. Source the emitted env file and handle both the new and
      # legacy key names — including the unprefixed names newer `supabase status
      # -o env` versions emit (e.g. API_URL, SERVICE_ROLE_KEY, SECRET_KEY) — so a
      # CLI rename can't silently leave the vars unset. If every fallback still
      # misses, fail fast with the names actually present instead of letting an
      # empty env limp downstream into the smoke step.
      #
      # The anon key is NOT optional (MV-153): the tenancy suites assert Row Level
      # Security as the AUTHENTICATED user, which needs a client signed in with the
      # publishable key + that user's JWT. The service-role key holds BYPASSRLS, so
      # without the anon key those suites skip — and a skipped tenancy suite is a
      # green CI run that proved nothing about cross-tenant isolation.
      - name: Export Supabase test env
        shell: bash
        run: |
          npx supabase status -o env > supabase.env
          set -a
          . ./supabase.env
          set +a
          url="${SUPABASE_URL:-${SUPABASE_API_URL:-${API_URL:-}}}"
          key="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}}"
          anon="${SUPABASE_ANON_KEY:-${ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-${PUBLISHABLE_KEY:-}}}}"
          if [ -z "$url" ] || [ -z "$key" ] || [ -z "$anon" ]; then
            echo "::error::Export Supabase test env: could not map URL/service-role/anon key" \
              "from 'supabase status -o env' output — the CLI likely renamed its" \
              "variable names again. Names present in supabase.env (values omitted):"
            cut -d= -f1 supabase.env | sort
            exit 1
          fi
          {
            echo "SUPABASE_TEST_URL=$url"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$key"
            echo "SUPABASE_TEST_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"
      # The smoke `skipIf`s when its env vars are absent, so a silent export
      # failure would green CI having tested nothing. Assert the vars are set, the
      # stack answers, and that the run actually executed.
      # NO_COLOR: the greps below parse the log, so vitest's ANSI color codes
      # must be off or the escape bytes break the pattern match.
      #
      # Both of the round-1 guards were INERT, reproduced against a real vitest
      # 4.1.8 run rather than inferred:
      #
      #   * `! grep -Eq 'Tests[[:space:]]+[1-9][0-9]* skipped'` only fired at a 100%
      #     skip. Vitest emits ONE combined counter line —
      #     `Tests  7 passed | 517 skipped (524)` — so the digits straight after
      #     `Tests` are the PASS count and ` skipped` never follows them. A run that
      #     skipped the entire tenancy matrix while the other itests passed matched
      #     nothing, and CI stayed green.
      #   * `grep -q 'tests/integration/tenant-isolation.itest.ts'` matched a fully
      #     SKIPPED suite: the verbose reporter prints the full path on `↓` lines
      #     too. It proved collection, not execution.
      #
      # Both are replaced by assertions that FAIL CLOSED. The counter checks are
      # positive — the summary line must have the shape "N passed (N)" and nothing
      # else — so a renamed counter, an added `skipped`/`todo`/`failed` column, or a
      # reporter format change all go red instead of silently matching nothing. The
      # execution checks are anchored on `✓`, which the reporter prints only for a
      # test that actually ran and passed.
      - name: Run integration smoke
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          test -n "$SUPABASE_TEST_URL"
          test -n "$SUPABASE_TEST_SERVICE_ROLE_KEY"
          # MV-153: asserted alongside the other two, because a missing anon key
          # skips the tenancy matrix rather than failing it.
          test -n "$SUPABASE_TEST_ANON_KEY"
          curl -fsS "$SUPABASE_TEST_URL/rest/v1/" \
            -H "apikey: $SUPABASE_TEST_SERVICE_ROLE_KEY" >/dev/null
          npm run test:integration -- --reporter=verbose | tee vitest-integration.log
          # Something ran at all.
          grep -Eq '^[[:space:]]+Tests[[:space:]]+[1-9][0-9]* passed' vitest-integration.log
          # ...and the summary reports passes and NOTHING else. `Tests  N passed (N)`
          # is the only accepted shape, at test and at file granularity.
          grep -Eq '^[[:space:]]+Tests[[:space:]]+[1-9][0-9]* passed \([0-9]+\)[[:space:]]*$' \
            vitest-integration.log
          grep -Eq '^[[:space:]]+Test Files[[:space:]]+[1-9][0-9]* passed \([0-9]+\)[[:space:]]*$' \
            vitest-integration.log
          # The Stage 1 exit gate must have EXECUTED. `✓ <path>` is printed per passing
          # test; a skipped suite prints `↓ <path>` instead, so this cannot be satisfied
          # by collection alone.
          grep -q '✓ tests/integration/tenant-isolation.itest.ts' vitest-integration.log
          grep -q '✓ tests/integration/case-rls.itest.ts' vitest-integration.log
          # ...and it must still be the matrix. 425 cells/tests today; the floor catches
          # the suite being gutted down to a token test that keeps the grep above happy.
          # Raise it when the matrix grows; do not lower it without saying why.
          test "$(grep -c '✓ tests/integration/tenant-isolation.itest.ts' vitest-integration.log)" -ge 400
          # MV-155: the ONE suite that proves the live-data movement — personal-case
          # minting, the owner→case backfill, the narrowed prediction guard and the
          # column-grant rewrite. Anchored by name for the same reason as the two above:
          # the lane's other guards catch a skip and a collection failure, but NOT the
          # file being deleted, renamed off `*.itest.ts`, having its top-level `describe`
          # commented out, or being gutted to two tests. In every one of those cases the
          # summary line still reads "N passed (N)" with a smaller N and CI stays green.
          grep -q '✓ tests/integration/case-backfill.itest.ts' vitest-integration.log
          # 36 tests today. Floor set below that so an incidental removal does not trip it,
          # high enough that a gutted suite does. Raise it when the suite grows.
          test "$(grep -c '✓ tests/integration/case-backfill.itest.ts' vitest-integration.log)" -ge 30
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
