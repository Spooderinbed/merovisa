<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyVisa — board</title>
<style>
:root{--paper:#f6f5f1;--surface:#fff;--ink:#1a1c1a;--muted:#6b6f6a;--line:rgba(0,0,0,.12);--teal:#0f5e54;--danger:#b1503a;--warn:#b07d22;--info:#0f5e54;--ok:#1f6d4a}
@media(prefers-color-scheme:dark){:root{--paper:#111210;--surface:#191b18;--ink:#e9eae6;--muted:#9aa09a;--line:rgba(255,255,255,.14);--teal:#4eb39f;--danger:#d6816d;--warn:#d6a94f;--info:#4eb39f;--ok:#5fae84}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{font-size:12px;color:var(--muted);margin:0 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.m{background:var(--surface);border:.5px solid var(--line);border-radius:12px;padding:12px 14px}
.mv{font-size:24px;font-weight:600}.ml{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:12px;border:.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#q{flex:1;min-width:160px;height:32px;border:.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font-size:13px}
.chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;padding:0 2px}
.wip{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}.wip.full{color:var(--warn)}
.empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 2px}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.card.next{border:2px solid var(--teal)}
.t{display:flex;align-items:center;justify-content:space-between}
.cid{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%}
.ti{font-size:13px;margin-top:3px}
.bs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.b{font-size:10.5px;padding:1px 8px;border-radius:999px;font-family:ui-monospace,monospace}
.bi{background:rgba(15,94,84,.13);color:var(--teal)}.bw{background:rgba(176,125,34,.16);color:var(--warn)}.bd{background:rgba(177,80,58,.14);color:var(--danger)}
.age{font-size:11px;color:var(--muted);margin-top:6px;font-family:ui-monospace,monospace}
.det{display:none;margin-top:8px;padding-top:8px;border-top:.5px solid var(--line);font-size:12.5px;color:var(--muted)}
.det p{margin:0 0 8px}.det a{color:var(--teal);font-size:12px;text-decoration:none}
.act{display:block;margin-top:8px;font-size:11.5px;border:.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>MyVisa — board</h1>
  <p class="sub">generated from board.json · 2026-06-19 · stale &gt; 7d · regenerate with npm run board</p>
  <div class="metrics" id="metrics"></div>
  <div class="bar">
    <button class="pill on" data-f="all">All</button>
    <button class="pill" data-f="P1">P1</button>
    <button class="pill" data-f="P2">P2</button>
    <button class="pill" data-f="P3">P3</button>
    <input id="q" placeholder="search cards…" />
    <label class="chk"><input type="checkbox" id="stale" /> stale only</label>
  </div>
  <div class="board" id="board"></div>
</div>
<script>window.__BOARD__={"columns":[{"key":"backlog","name":"Backlog","wip":null,"active":false},{"key":"ready","name":"Ready","wip":5,"active":true},{"key":"inprogress","name":"In progress","wip":1,"active":true},{"key":"inreview","name":"In review","wip":3,"active":true},{"key":"blocked","name":"Blocked","wip":null,"active":true},{"key":"done","name":"Done","wip":null,"active":false}],"cards":[{"id":"MV-01","col":"done","done":"2026-06-19","pri":"P1","owner":"agent","badge":"human-gate","file":"cards/MV-01-match-engine-consolidation.md","title":"Consolidate the two match engines","summary":"DONE pending review: anon results now read the same DB catalogue + shared computeMatches as signed-in; GPA normalized at the boundary (root cause in from-assessment); program-level anon results; backcompat shape-guard. Gate green (typecheck/lint/test 1086 pass). Pushed to origin/feat/context-budget (8f06f00); PR not yet opened (gh unauthed — founder opens via compare link).","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":1,"stale":false},{"id":"MV-05","col":"blocked","pri":"P1","owner":"founder+agent","badge":"founder: legal text, under-18, consent","file":"cards/MV-05-legal-disclaimer-boundary.md","title":"Legal / disclaimer / data boundary","summary":"Engineering slice DONE + merged to master (46752f3; gate green): not-immigration-advice disclaimer on verdict/results/dashboard/matches/plan (VerdictDisclaimer), + working right-to-delete path (POST /api/account/delete removes storage+all owned rows+auth user, partial-failure→500 not ok:true) with a type-to-confirm UI on profile. BLOCKED on founder/lawyer for the rest: final legal wording, retention/ToS/privacy policy text, under-18 stance; consent-at-upload deferred until the privacy policy exists. Card can't reach Done until those land.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-02","col":"done","done":"2026-06-19","pri":"P2","owner":"agent","badge":"human-gate","file":"cards/MV-02-surface-swallowed-errors.md","title":"Surface swallowed errors","summary":"DONE pending review (pushed origin 26216c8; PR not opened): a 13-agent audit found 4 real swallows (profile/section, documents DELETE, documents upload, assess signed-in insert) + 5 already-correct routes. All 4 now return a real error status + structured log on a failed write; document-card delete now guards on res.ok; leads catch now logs. Gate green: typecheck/lint/1106 tests (+8). TDD failing-path test per fix.","created":"2026-06-18","entered":"2026-06-19","ageDays":1,"inColDays":0,"cycleDays":1,"stale":false},{"id":"MV-04","col":"done","done":"2026-06-19","pri":"P2","owner":"agent","badge":"human-gate","file":"cards/MV-04-data-freshness-ux.md","title":"Data-freshness UX + stale-fact CI","summary":"DONE pending review (pushed origin 26216c8; PR not opened): scoring-critical facts (CONFIG_PROVENANCE) now have a runtime freshness check — past reverifyBy degrades the verdict card (amber warn, treat-as-indicative) instead of showing a stale verdict as current, plus a CI guard (tests/data/scoring-freshness.test.ts) that goes red when a verdict input ages out. Dormant today (armed until 2027-06-07). Gate green: typecheck/lint/1114 tests (+8). No scorer value changed; goldens byte-identical.","created":"2026-06-18","entered":"2026-06-19","ageDays":1,"inColDays":0,"cycleDays":1,"stale":false},{"id":"MV-03","col":"done","done":"2026-06-19","pri":"P3","owner":"agent","badge":"human-gate","file":"cards/MV-03-work-input-field.md","title":"Wire or relabel the dead work input","summary":"DONE pending review (pushed origin 26216c8; PR not opened): recon found work.title actually feeds the document checklist, but Relevance/Years imply a verdict effect no scorer reads. Chose context-only relabel — WorkGapEditor now states 'Optional. Your role helps tailor your document checklist — it doesn't change your verdict.' Copy-only, no scoring change, goldens byte-identical. Gate green: typecheck/lint/1115 tests (+1).","created":"2026-06-18","entered":"2026-06-19","ageDays":1,"inColDays":0,"cycleDays":1,"stale":false},{"id":"MV-A2","col":"blocked","pri":"","owner":"founder","badge":"founder: pwd toggle","file":"cards/MV-A2-supabase-migration.md","title":"Apply Supabase advisor migration","summary":"Migration applied to prod; 3 advisor findings cleared (verified 2026-06-18). Only the leaked-password dashboard toggle remains — founder-only.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-10","col":"blocked","pri":"P2","owner":"agent","badge":"blocked: OSHC","file":"cards/MV-10-cost-estimate-tab.md","title":"Cost-estimate tab","summary":"Blocked on sourcing OSHC (overseas student health cover) data. Stays an honest 'coming soon' until then.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-06","col":"backlog","pri":"P2","owner":"agent","file":null,"title":"Integrate ledger slice E/I","summary":"~195 ready research findings that feed scoring/cost copy. Do after the engines are unified.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-07","col":"backlog","pri":"P2","owner":"agent","file":null,"title":"CRICOS scrape pipeline","summary":"Generated-data pipeline → providers + evidence tables → a real per-provider Genuine-Student answer.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-08","col":"backlog","pri":"P2","owner":"agent","file":null,"title":"Outcome-validation loop (the moat)","summary":"Capture applied / offer / refused / visa to validate verdicts. Design the model soon; build after traffic.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-09","col":"done","done":"2026-06-19","pri":"P3","owner":"agent","badge":"human-gate","file":"cards/MV-09-fx-single-source.md","title":"Replace hardcoded FX rates","summary":"DONE pending review (local commit, not pushed; awaiting founder GO): budgetToAud now derives budget→AUD from the canonical FX_RATES table via a shared toAud helper — divergent inline rates + the 'Replace with FX lookup later' TODO removed (one source of truth). NPR corrected ÷100→÷90 (MVP corridor; INR/BDT/PKR now exactly canonical; USD/AUD/NGN unchanged) — an intended match-path diff locked by tests; scoring golden byte-identical (match path, not engine). Codex adversarial pass: no defects. Gate green: typecheck/lint/1121 tests (+6). Two client-side 135 literals (callouts, budget-step) noted as deferred hygiene follow-up — already agree with canonical, not divergent.","created":"2026-06-18","entered":"2026-06-19","ageDays":1,"inColDays":0,"cycleDays":1,"stale":false},{"id":"MV-11","col":"backlog","pri":"P3","owner":"agent","file":null,"title":"AI guide","summary":"Claude Haiku 4.5 + cached-corpus RAG over the TS fact layer. Deferred until the deterministic core is reliable.","created":"2026-06-18","entered":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-A1","col":"done","pri":"","owner":"agent","file":"cards/MV-A1-push-branch.md","title":"Push feat/context-budget","summary":"Pushed to origin/feat/context-budget (upstream set). PR link ready; open via GitHub URL (gh not authed).","created":"2026-06-18","entered":"2026-06-18","done":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":0,"stale":false},{"id":"MV-D0","col":"done","pri":"","owner":"agent","file":"../audits/2026-06-18-EXECUTION-CHECKPOINT.md","title":"Phase 0 + Phase 1 (9 slices)","summary":"GPA normalize · conversion/auth · doc re-score removed · matches filter · dashboard cleanup · English test-type · results IA · scholarships · program notes. 1075 tests green.","created":"2026-06-18","entered":"2026-06-18","done":"2026-06-18","ageDays":1,"inColDays":1,"cycleDays":0,"stale":false}],"config":{"staleDays":7,"updated":"2026-06-19"}};(function clientMain() {
  var B = window.__BOARD__;
  var pri = { P1: "var(--danger)", P2: "var(--warn)", P3: "var(--muted)" };

  function metric(v, l) {
    return '<div class="m"><div class="mv">' + v + '</div><div class="ml">' + l + "</div></div>";
  }
  var ready = B.cards.filter(function (c) { return c.col === "ready"; }).length;
  var prog = B.cards.filter(function (c) { return c.col === "inprogress"; }).length;
  var review = B.cards.filter(function (c) { return c.col === "inreview"; }).length;
  var done = B.cards.filter(function (c) { return c.col === "done"; }).length;
  var stale = B.cards.filter(function (c) { return c.stale; }).length;
  document.getElementById("metrics").innerHTML =
    metric(ready, "Ready to start") + metric(prog, "In progress") +
    metric(review, "Awaiting GO") + metric(stale, "Stale (>" + B.config.staleDays + "d)");

  function badge(c) {
    var out = "";
    if (c.badge === "next") out += '<span class="b bi">next up</span>';
    if (c.badge === "GO") out += '<span class="b bw">awaiting GO</span>';
    if (c.badge && c.badge.indexOf("blocked") === 0) out += '<span class="b bd">' + c.badge + "</span>";
    if (c.stale) out += '<span class="b bd">stale ' + c.inColDays + "d</span>";
    return out;
  }
  function ageLine(c) {
    if (c.col === "done") return c.cycleDays != null ? "cycle " + c.cycleDays + "d" : "done";
    var t = "age " + c.ageDays + "d";
    if (c.inColDays != null) t += " · " + c.inColDays + "d in column";
    return t;
  }
  function actLabel(col) {
    if (col === "ready") return "Copy: start this";
    if (col === "inreview") return "Copy: approve";
    return "Copy: ask about this";
  }
  function actText(c) {
    if (c.col === "ready") return "Start " + c.id + ": move it to In Progress on the board and begin the work.";
    if (c.col === "inreview") return "Go ahead with " + c.id + ".";
    return "Tell me more about " + c.id + ".";
  }

  var boardEl = document.getElementById("board");
  function render() {
    var f = document.querySelector(".pill.on").getAttribute("data-f");
    var q = document.getElementById("q").value.trim().toLowerCase();
    var onlyStale = document.getElementById("stale").checked;
    boardEl.innerHTML = "";
    B.columns.forEach(function (col) {
      var list = B.cards.filter(function (c) {
        if (c.col !== col.key) return false;
        if (f !== "all" && c.pri !== f) return false;
        if (onlyStale && !c.stale) return false;
        if (q && (c.id + " " + c.title + " " + c.summary).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      var total = B.cards.filter(function (c) { return c.col === col.key; }).length;
      var wip = "";
      if (col.wip) {
        var full = total >= col.wip;
        wip = '<span class="wip' + (full ? " full" : "") + '">' + total + "/" + col.wip + "</span>";
      } else {
        wip = '<span class="wip">' + total + "</span>";
      }
      var h = '<div class="col"><div class="ch"><span>' + col.name + "</span>" + wip + "</div>";
      if (!list.length) h += '<div class="empty">— none</div>';
      list.forEach(function (c) {
        var dot = c.pri ? '<span class="dot" style="background:' + pri[c.pri] + '"></span>' : "";
        var b = badge(c);
        h += '<div class="card' + (c.badge === "next" ? " next" : "") + '" data-id="' + c.id + '">' +
          '<div class="t"><span class="cid">' + c.id + "</span>" + dot + "</div>" +
          '<div class="ti">' + c.title + "</div>" +
          (b ? '<div class="bs">' + b + "</div>" : "") +
          '<div class="age">' + ageLine(c) + "</div>" +
          '<div class="det"><p>' + c.summary + "</p>" +
          (c.file ? '<a href="' + c.file + '">open dossier →</a>' : "") +
          '<button class="act" data-act="' + c.id + '">' + actLabel(c.col) + "</button></div>" +
          "</div>";
      });
      h += "</div>";
      boardEl.insertAdjacentHTML("beforeend", h);
    });
  }
  render();

  boardEl.addEventListener("click", function (e) {
    var act = e.target.closest(".act");
    if (act) {
      e.stopPropagation();
      var c = B.cards.find(function (x) { return x.id === act.getAttribute("data-act"); });
      if (c && navigator.clipboard) {
        navigator.clipboard.writeText(actText(c));
        var o = act.textContent; act.textContent = "copied — paste to Claude"; setTimeout(function () { act.textContent = o; }, 1600);
      }
      return;
    }
    if (e.target.closest("a")) return;
    var card = e.target.closest(".card");
    if (!card) return;
    var d = card.querySelector(".det");
    d.style.display = d.style.display === "block" ? "none" : "block";
  });
  document.querySelectorAll(".pill").forEach(function (p) {
    p.addEventListener("click", function () {
      document.querySelectorAll(".pill").forEach(function (x) { x.classList.remove("on"); });
      p.classList.add("on"); render();
    });
  });
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("stale").addEventListener("change", render);
})();</script>
</body>
</html>
