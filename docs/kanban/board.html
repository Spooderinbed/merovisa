<style>
:root{--paper:#f6f5f1;--surface:#fff;--ink:#1a1c1a;--muted:#6b6f6a;--line:rgba(0,0,0,.12);--teal:#0f5e54;--danger:#b1503a;--warn:#b07d22;--info:#0f5e54;--ok:#1f6d4a}
@media(prefers-color-scheme:dark){:root{--paper:#111210;--surface:#191b18;--ink:#e9eae6;--muted:#9aa09a;--line:rgba(255,255,255,.14);--teal:#4eb39f;--danger:#d6816d;--warn:#d6a94f;--info:#4eb39f;--ok:#5fae84}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{font-size:12px;color:var(--muted);margin:0 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.m{background:var(--surface);border:.5px solid var(--line);border-radius:12px;padding:12px 14px}
.mv{font-size:24px;font-weight:600}.ml{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:12px;border:.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#q{flex:1;min-width:160px;height:32px;border:.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font-size:13px}
.chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;padding:0 2px}
.wip{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}.wip.full{color:var(--warn)}
.empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 2px}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.card.next{border:2px solid var(--teal)}
.t{display:flex;align-items:center;justify-content:space-between}
.cid{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%}
.ti{font-size:13px;margin-top:3px}
.bs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.b{font-size:10.5px;padding:1px 8px;border-radius:999px;font-family:ui-monospace,monospace}
.bi{background:rgba(15,94,84,.13);color:var(--teal)}.bw{background:rgba(176,125,34,.16);color:var(--warn)}.bd{background:rgba(177,80,58,.14);color:var(--danger)}
.age{font-size:11px;color:var(--muted);margin-top:6px;font-family:ui-monospace,monospace}
.det{display:none;margin-top:8px;padding-top:8px;border-top:.5px solid var(--line);font-size:12.5px;color:var(--muted)}
.det p{margin:0 0 8px}.det a{color:var(--teal);font-size:12px;text-decoration:none}
.act{display:block;margin-top:8px;font-size:11.5px;border:.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
</style>
</head>

60dc, owner ece83f09).","created":"2026-06-18","entered":"2026-06-20","ageDays":17,"inColDays":15,"cycleDays":null,"stale":true},{"id":"MV-09","col":"done","done":"2026-06-19","pri":"P3","owner":"agent","badge":"human-gate","file":"cards/MV-09-fx-single-source.md","title":"Replace hardcoded FX rates","summary":"DONE pending review (local commit, not pushed; awaiting founder GO): budgetToAud now derives budget→AUD from the canonical FX_RATES table via a shared toAud helper — divergent inline rates + the 'Replace with FX lookup later' TODO removed (one source of truth). NPR corrected ÷100→÷90 (MVP corridor; INR/BDT/PKR now exactly canonical; USD/AUD/NGN unchanged) — an intended match-path diff locked by tests; scoring golden byte-identical (match path, not engine). Codex adversarial pass: no defects. Gate green: typecheck/lint/1121 tests (+6). Two client-side 135 literals (callouts, budget-step) noted as deferred hygiene follow-up — already agree with canonical, not divergent.","created":"2026-06-18","entered":"2026-06-19","ageDays":17,"inColDays":16,"cycleDays":1,"stale":false},{"id":"MV-11","col":"done","pri":"P3","owner":"agent","file":null,"title":"AI guide","summary":"CLOSED STALE 2026-07-02 (ground-truth audit): fully superseded by MV-63 (DeepSeek client + grounded context + auth-gated route + chat UI, PR #10) hardened by MV-78 (timeout, PR #32) + MV-79 (forged-history defense, PR #33); DEEPSEEK_API_KEY set, live in prod at master 9c9fd0b. The card’s literal spec (Claude Haiku + cached-corpus RAG) would be a NEW architecture card if ever wanted — the shipped deterministic-grounding design already delivers the student outcome. Original: Claude Haiku 4.5 + cached-corpus RAG over the TS fact layer. Deferred until the deterministic core is reliable.","created":"2026-06-18","entered":"2026-07-02","badge":"CLOSED STALE 2026-07-02: superseded by MV-63 (+MV-78/79 hardening) — guide LIVE in prod","ageDays":17,"inColDays":3,"cycleDays":null,"stale":false},{"id":"MV-13","c ers/specs/2026-06-28-readiness-map-design.md. NEXT = BUILD per spec (TDD) after compact.","title":"Dashboard readiness map (decomposed verdict)","created":"2026-06-28","entered":"2026-06-28","ageDays":7,"inColDays":7,"cycleDays":null,"stale":false},{"id":"MV-67","col":"done","pri":"P2","owner":"agent","badge":"Trust-copy fix on the ONLY anon-reachable error boundary (global-error.tsx, MV-62). Tiny, self-contained, TDD.","file":"MV-67-global-error-copy.md","title":"Fix global-error.tsx false 'saved data is safe' claim (anon trust)","summary":"BACKLOG (agent-ownable, founder-gated merge). app/global-error.tsx (the root-layout last-resort boundary shipped in MV-62) renders 'We hit an unexpected error loading MyVisa. Your saved data is safe. Please try again.' at ~line 36 (confirmed present). That saved-data claim is NOT always true: global-error is the ONLY error boundary an ANONYMOUS visitor can reach (it fires when a layout itself throws -- e.g. app/(focused)/layout.tsx or the root layout getUser() -- past the per-segment error.tsx). An anon user whose assessment hit a persist-miss (POST /api/assess returned 200 with id:null) may have NOTHING saved server-side, so promising their data is safe is a false reassurance on a trust-first product. FIX (surgical, copy-only): reword app/global-error.tsx to drop the unconditional saved-data claim and keep only what is always true -- e.g. 'We hit an unexpected error loading MyVisa. This is usually temporary - please try again.' Do NOT touch app/(app)/error.tsx (signed-in only, so 'your saved data is safe' is correct there) or app/(focused)/error.tsx (already avoids the claim -- both confirmed present). TDD: update the global-error describe block in tests/app/error-boundaries.test.tsx to assert the honest copy, watch it fail, then change the file. Gate: typecheck + lint + npx vitest run tests/app/error-boundaries.test.tsx (+ full suite before PR). No scoring/DB/migration; goldens byte-identical. Branch mv-67-global-error-copy of d (no score leak, no celebration on a refusal, reduced-motion sound). Verdict card keeps animate-rise (beat 1); the band-label pill ALONE gets a new animate-settle (beat 2) whose ~120ms hold is baked into the keyframe (0%,22% of 0.55s) NOT animation-delay, so the global prefers-reduced-motion guard collapses it with no blank flash and the never-shown score is never animated. MV-39 OutcomeSelfReport: a successful POST shows a deliberately neutral \"Saved\" (text-ink-soft, no colour/glyph -- the same control reports a refusal as well as an offer) that eases in via animate-fade (no hold, can not be clipped by a fast router.refresh) and clears when the legal-next-steps set advances (render-time seenKey reset, not an effect). Codex round folded 2 fixes pre-merge: clear confirmed on any new attempt (never \"Saved\"+error together); fade not settle for the note. TDD +4 (suite 248 files / 1561). Optional staggered factor-bars deliberately skipped (animating a numeric surface = trust risk). Spec docs/superpowers/specs/2026-06-28-verdict-reveal-design.md; audit docs/audits/2026-06-25-design-division-polish-audit.md #25.","created":"2026-06-28","entered":"2026-06-28","ageDays":7,"inColDays":7,"cycleDays":null,"stale":false},{"id":"MV-77","col":"done","pri":"P1","owner":"agent","badge":"merged → master (PR #29)","file":null,"title":"Dashboard \"Your journey\" panel (MV-45 #3 where-am-I rail)","summary":"IN REVIEW 2026-06-28 (PR #29, branch mv-77-journey-rail, founder-gated merge). Carved from the MV-45 umbrella -- the global cross-stage \"where am I\" orientation rail (consultancy-replacement: here is the sequence, you are here, next is X). A DASHBOARD PANEL (founder pick over persistent chrome -- we already have AppBar + MobileTabBar). 6 stages Assessed->Profile->Matches->Plan->Documents->Apply, each progress-derived from real signals only (mirrors buildReadiness/ReadinessMap); +1 query (listShortlistForUser), Plan load widened to all-items (zero net extra). Codex gpt-5.5 xhig e":"Step 4 multi-subject: primary field owns the verdict + up to 2 'also considering' fields (broaden matches, exploratory label, honest competitiveness note)","summary":"Founder ask (2): let students pick multiple subjects without breaking the honest single verdict. Decision (mine + Codex): Option A -- one primary fieldOfStudy owns the verdict + scoring baseline exactly as today, plus up to 2 additive alsoConsidering fields that only broaden which programs surface. Scope win: scoring engine untouched, all golden scores byte-identical (proven inert). Codex guardrail built: also-considering programs carry an explicitly exploratory match reason so a student never reads the primary verdict onto them. New pure modules lib/wizard/also-considering.ts + lib/scoring/field-note.ts (honest 'less/more competitive admit' note). Matching = 3-tier soft sort (primary->also->rest). Additive types + Zod (disjoint/dedupe refine), wizard multi-select (cap 2, primary excluded, disabled at cap), profile-editor parity, recap 'also considering' line, JSONB persistence (no migration). Deferred: per-field verdicts (Option C) + results-page note surfacing.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-101","col":"done","pri":"P1","owner":"agent","badge":"BUILT 2026-07-04 (branch mv-101-results-competitiveness-note, STACKED on MV-99/#54). Surfaces MV-99 competitiveness note on the results page via assemble payload. tsc/eslint clean; suite 1624 pass / 1 fail = pre-existing MV-80 1-July freshness; +4 tests. Founder-gated merge; merge MV-99 first.","file":"cards/MV-101-results-competitiveness-note.md","title":"Results-page competitiveness note: surface MV-99 honest also-considering line near the verdict (not just in the wizard)","summary":"MV-99 follow-up. The honest \"Business is a less competitive admit than Computer Science\" line only showed in the wizard at point-of-choice; a student reviewing results never saw it. Compute secondary-verdicts.ts + presentational components/results/secondary-verdicts.tsx (replaces the results render of CompetitivenessNote). Primary path byte-identical (goldens unchanged), no DB/migration. Forced integrity fixes: from-sections forwards alsoConsidering (signed-in path), matches exploring-label reworded off 'not covered by your verdict', IntendedStudyPatch disjoint/dedup refine. Codex must-fixes: editor always sends alsoConsidering (clears stale extras), AI-guide context carries the secondary bands (word-only). Spec docs/superpowers/specs/2026-07-04-per-field-verdicts-design.md rev 3.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-90","col":"done","pri":"P1","owner":"agent","badge":"SHIPPED 2026-07-03: primitives + 76-site migration on branch mv-90-card-primitives; gate green (1612 pass, only red = MV-80 freshness); founder-gated merge.","file":"cards/MV-90-card-verdictpill-primitives.md","title":"Overhaul Phase 1: Card + VerdictPill primitives — extract the 28×-copy-pasted card shell and verdict pill into components/ui","summary":"Phase 1 slice from the MV-87 umbrella (the correction from MV-42: only VERDICT_LABELS shipped; the primitives never did). Extract a shared Card shell primitive and a VerdictPill primitive into components/ui/, then migrate every copy-pasted call site to them with rendered output byte-identical (exact className strings preserved so goldens/presentational tests stay green unchanged). Closes design-division audit finding #12 (incl. the rounded-xl radius drift — folds onto the 12px card radius, render-identical in this app's scale). Scout correction: census = 69 shell sites across 7 static families (not 28), 8 pill sites + 1 unpilled label; #13 (Button loading contract), #18 (fake-loading theatre) and #26 (Meter) are separate follow-up slices, NOT here. TDD: primitive unit tests first, then site-by-site migration with the suite as the harness. Scope guard: presentational refactor only — class SET per site preserved (order normalizes shell-first); deliberate unifications: possible pills gain the contrast-tuned text-possible-ink, 2 pill outliers gain inline-flex items-center, labels all source from VERDICT_LABELS (kills 5 local dicts + 1 hardcode). Excluded: form-control shell (29 sites — future Input primitive), ternary-tone shells, near-miss singletons.","created":"2026-07-03","entered":"2026-07-03","ageDays":2,"inColDays":2,"cycleDays":null,"stale":false},{"id":"MV-91","col":"done","pri":"P1","owner":"agent","badge":"SHIPPED 2026-07-03 → PR #45 (branch mv-91-button-loading off origin/master f6cada8). Button loading contract + migrated document-card (Uploading/View) + refresh-button onto the primitive; gate green (tsc/lint 0, suite 1604 pass / 1 fail = MV-80 freshness only, +8 tests); live idle render verified. Founder-gated merge; independent of MV-90 (#44).","file":"cards/MV-91-button-loading-contract.md","title":"Overhaul Phase 1: Button loading contract — in-flight primitive + migrate the drifted loading buttons","summary":"Third of the Phase-1 \"Primitive completion\" trio (Card+VerdictPill shipped in MV-90; audit finding #13). components/ui/button.tsx gains a loading?:boolean + loadingLabel?:ReactNode contract: when loading the button is disabled (disabled||loading, never double-submits), sets aria-busy=\"true\" (absent when idle), and renders {loadingLabel ?? children} followed by ONE canonical mono ellipsis (aria-hidden … in font-mono — the design-system \"system is working\" voice). Fixes the concrete drift in document-card.tsx (Upload said \"Uploading…\" but View said \"Loading...\" — three ASCII dots, same component) and folds assess/refresh-button.tsx, a raw <button> that re-implemented the primary/lg class string, back onto the primitive (<Button size=\"lg\" loading={pending} loadingLabel=\"Refreshing\">). Adds the missing aria-busy a11y signal to every loading button. Deliberately NOT touched (not loading buttons) 1","owner":"agent","badge":"SHIPPED 2026-07-03 → PR #48 (doc-only ADR; founder sign-off gate)","file":"cards/MV-93-motion-v2-adr.md","title":"Overhaul Phase 0c (doc): Motion v2 ADR (CSS-first motion system)","summary":"Second of the two decision docs the overhaul needs locked before Phase-2 build (companion to the MV-88 type-scale ADR; third slice carved from the over-broad 'design-system v2' bundle). Standalone doc docs/design/2026-07-03-motion-v2-adr.md (foldable into the overhaul spec on sign-off). Grounded in a 2026-07-03 audit of the app's CSS motion system: @theme has 1 easing (--ease-calm cubic-bezier .22/.61/.36/1) + 3 keyframe animations (fade/rise/settle — ALL opacity+transform, already compositor-safe; settle bakes its 0-22% hold into keyframe PHASES not animation-delay so the reduced-motion guard collapses it cleanly) + a global prefers-reduced-motion collapse; usage tally ease-calm x24, transition-colors x14, animate-pulse x14, duration-150 x9, ... transition-all x1 (a latent smell); NO framer-motion/motion in package.json. DECISION = stay CSS-FIRST, no runtime animation library (bundle discipline on a low-end-Android funnel; narrow Phase-2 escape hatch = one tree-shaken micro-primitive for a single surface only). TWO motion classes: movement = opacity+transform only (compositor); state = paint props only (color/bg/border). HARD RULES: never transition-all; one easing; never bypass reduced-motion (bake delays into keyframe phases). Vocabulary = ease-calm + fade/rise/settle + pulse(skeletons). Stagger convention = <=5 siblings / 40-60ms / nothing after ~700ms. Alternatives A(chosen)/B(framer-motion, ~30KB rejected)/C(no ADR) recorded; 3 open questions for sign-off (duration tokens?; second easing?; pre-define slide-* keyframes?). DOC-ONLY: zero source/test files touched -> no regression risk, suite unaffected; typecheck+lint green. APPLYING it (remove the 1 transition-all; optional --dur-* tokens) is a SEPARATE founder-gated slice. ID MV-93 because 90/91/92 are claimed by in-flight branches. FOUNDER GATE: ADR sign-off (batch with MV-88). Spec: docs/design/2026-07-03-elevated-calm-overhaul-spec.md.","created":"2026-07-03","entered":"2026-07-03","ageDays":2,"inColDays":2,"cycleDays":null,"stale":false},{"id":"MV-94","col":"done","pri":"P2","owner":"agent","badge":"PR #49","file":"cards/MV-94-drop-transition-all.md","title":"Overhaul Phase 1 (apply): drop the last transition-all (Motion v2 ADR item 1)","summary":"First apply-slice off the locked Motion v2 ADR (MV-93). The ADR's hard rule is never transition-all — name the properties. The audit left exactly 1 site: components/ui/progress-dots.tsx, where the active-step pill used transition-all to animate its width grow (w-1.5→w-6) + colour (bg-bg-tint→bg-primary). Replaced with the explicit transition-[width,background-color] (matches the codebase style, e.g. button.tsx transition-[background-color,transform]; width is the sanctioned intentional-pill-grow pattern also used by accuracy-meter/factor-bars, not layout thrash). Rendered behaviour byte-identical — the two props already animated under transition-all; this only names them. TDD red-first: new class-assertion test locks transition-[width,background-color] present + transition-all absent (mirrors completeness-ring.test.tsx). Audit: 0 transition-all remaining in components/+app/ after. Uncontroversial + orthogonal to the ADR's open questions, so safe ahead of full sign-off. Suite 1598 (1597 pass, +1 new test; the 1 red = pre-existing MV-80 freshness timer, unrelated). Independent slice; ID MV-94 because board tops out at MV-89 and 90-93 are claimed by in-flight branches.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-95","col":"done","pri":"P2","owner":"agent","badge":"PR #50","file":"cards/MV-95-honest-recap.md","title":"Overhaul Phase 1: honest recap — drop the fake 3000ms Analyzing theatre (audit #18)","summary":"Carves the honest-recap half of the overhaul spec's Phase-1 MV-90 (Motion v2 + honest recap); the motion-system halves stay gated on the Motion v2 ADR (PR #48). Every wizard-completer was held on a fixed 3000ms 'Analyzing your profile' timer before results, regardless of when the real /api/assess result landed — pure latency theatre at the highest-traffic funnel moment, exactly the anti-pattern a trust-first product should never ship. Fix (components/assess/profile-recap.tsx only): durationMs default 3000->600 (a genuine reveal beat, never padding — AssessFlow already gates the real transition on payload && recapElapsed, so results now appear at max(real API latency, 600ms) = honest waiting only); summary stagger i*0.5s->i*0.08s so the reveal completes within the shorter window; label 'Analyzing your profile'->'Your answers' (honest summary label, not a fake-work claim; the existing pulse dot honestly signals in-flight work). Auto-advance kept over the spec's explicit 'See my result' button (lower-friction, more honest, smaller). Orthogonal to the unsigned type/motion ADRs + pending mascot: reuses the sanctioned animate-rise keyframe, adds no motion primitive. TDD +2 (tests/assess/profile-recap-timing.test.tsx, RTL+fake-timers, red-first; locks the two objective trust invariants — short handoff window + no /analyz/i label — not the exact copy/timing, which stay founder-tunable). Blind calls flagged on the card: exact copy, 600ms/stagger feel, button-vs-auto fork.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-96","col":"done","pri":"P2","owner":"agent","badge":"PR #51","file":"cards/MV-96-corridor-provider.md","title":"Overhaul Phase 1: corridor theme provider (np-au, expansion-ready)","summary":"Ships the post-onboarding corridor personalization ARCHITECTURE (spec MV-91) — the last Phase-1 slice not gated on the type-scale ADR (#47), Motion v2 ADR (#48), or the mascot (MV-85): (1) new lib/theme/corridor.ts registry (np-au → label + danphe mascotVariant; corridorForHomeCountry case-insensitive 'nepal' → np-au, else null = neutral brand; DEFAULT_CORRIDOR for the signed-in MVP, same Nepal assumption lib/scoring/from-sections.ts:42 already pins). (2) globals.css [data-corridor=np-au] light+dark blocks overriding ONLY --accent/--accent-tint (danphe teal-blue #15687a/#7cc4d4 — flagged founder call; WCAG AA-proved 5.47–13.2 both themes; zero blast radius: no component consumes accent yet). (3) AssessFlow results phase wraps Results in a display:contents data-corridor carrier from profile.homeCountry (anon activation = results onward; unknown country → no attribute). (4) (app) shell layout wraps chrome+content in the same carrier (signed-in always-on, Phase-2-ready; no DB read added). Server-safe/no-flash by construction — attribute renders from known state, no pre-hydration script. TDD red-first +11 tests incl. NEW permanent guard tests/styles/corridor-tokens.test.ts (accents-only invariant + WCAG re-proof + marketing-sources-never-carry-data-corridor scan). Registry omits copy-nods until a consumer exists. First consumers: spec-MV-94 results accents, Phase-2 shell, mascot variant resolution.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-97","col":"done","pri":"P1","owner":"agent","badge":"SHIPPED 2026-07-04 (branch mv-97-wizard-funnel-overhaul off design-stack); tsc clean, suite 1661 pass / 1 fail = pre-existing MV-80 freshness; founder-gated merge.","file":"cards/MV-97-wizard-funnel-overhaul.md","title":"Overhaul Phase 1: wizard funnel — CGPA step-3 input, AUD step-7 corridor, English equivalents, gap preview, direction-aware slide + word-cascade recap","summary":"Carved from the MV-87 umbrella wizard slice. Step 3 gains a Percentage/GPA-4.0 grade-system toggle (new lib/scoring/grade-scale.ts converts across scales via the engine normalizer; honest percentage-equivalent caption; scale-aware slider) — CGPA flows end-to-end since scoring already normalizes CGPA to a percentage. Step 7 replaces USD with AUD (NPR to AUD, live A$ conversion from the single fx-rates source, indicative NPR-per-AUD caption, persisted-USD sessions auto-migrate; new formatAud). English step shows the live IELTS equivalent for PTE/TOEFL plus a provisional-6.0 note. Steps 5/6 get a positive gap-preview note so the conditional gap screen is never a surprise. Motion: direction-aware slide-fwd/slide-back between steps plus a staggered step-shell reveal; post-wizard recap assembles word-by-word (reduced-motion safe, no fake analyzing text). Opacity/transform only per the Motion v2 ADR. TDD +16 across education/budget/english/graduation/use-wizard-state/recap. DEFERRED to their own slices: step-4 multi-subject (single-select enum to array is a data-model change touching Zod/scoring/matches/persistence), matches-page progressive disclosure, footer CLS/perf.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-98","col":"done","pri":"P1","owner":"agent","badge":"SHIPPED 2026-07-04 (branch mv-98-layout-cls-perf off design-stack; commit b96852a) -> PR #53; tsc/eslint clean, suite 1645 pass / 1 fail = pre-existing MV-80 freshness; founder-gated merge.","file":"cards/MV-98-layout-cls-perf.md","title":"Footer-first CLS fix + perf: pin footer (min-h-dvh flex), reserve loading height, lazy-load posthog","summary":"Fixes the founder-reported footer-first flash. Root cause: route-group shells put <main> and <Footer> as plain siblings with no min-height / full-height column, so during streaming the short loading.tsx fallback let the footer paint high, then the taller real page shoved it down. Fix: (app)/(marketing)/(focused) layouts become flex min-h-dvh flex-col with a flex-1 <main> (footer pinned to viewport bottom); (app)/(marketing) loading skeletons reserve min-h-[60vh]; analytics-provider lazy-loads posthog via dynamic import inside the effect after the key check (off the initial bundle for anon visitors). Corridor/data-corridor, AppBar, MobileTabBar, auth redirects preserved. New source-level ratchet tests/styles/layout-cls-ratchet.test.ts. Deferred: duplicate auth.getUser() dedup (auth-touching, own slice); browser-verify the streaming no-jump under throttled network.","created":"2026-07-04","entered":"2026-07-04","ageDays":1,"inColDays":1,"cycleDays":null,"stale":false},{"id":"MV-81","col":"done","pri":"P1","owner":"agent","badge":"","file":"cards/MV-81-ci-integration-env-fix.md","title":"CI integration job env mapping fix (renamed Supabase CLI status output)","summary":"The integration job's 'Export Supabase test env' step has failed on every run for ~10 days (run 28576388321: both SUPABASE_TEST_URL/SUPABASE_TEST_SERVICE_ROLE_KEY empty in the smoke step's env) because current Supabase CLI versions emit unprefixed names (API_URL, SERVICE_ROLE_KEY, SECRET_KEY) in `supabase status -o env` output that the old fallback chains never checked. Fixed by extending both fallback chains to include the unprefixed names and adding a fail-fast guard that exits 1 with a names-only diagnostic (never values) when the mapping still misses, so a future CLI rename is a one-glance fix instead of a silent empty-env failure two steps downstream. Only the one step + its comment touched; continue-on-error preserved. Verification is the PR's own Actions run reaching the smoke step with non-empty env.","created":"2026-07-02","entered":"2026-07-02","ageDays":3,"inColDays":3,"cycleDays":null,"stale":false},{"id":"MV-103","col":"done","pri":"P2","owner":"agent","badge":"In Review on branch mv-103-journey-marker (PR, founder-gated merge). Part 2 of the global journey-rail spec (Part 1 = MV-77 dashboard rail).","file":"MV-103-journey-marker.md","title":"Persistent \"where am I\" journey marker in the signed-in chrome (MV-45 #3b)","summary":"BUILT 2026-07-05 on branch mv-103-journey-marker off origin/master (founder merges to master to close -> Done). Seco
