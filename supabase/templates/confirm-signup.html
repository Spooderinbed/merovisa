<!--
  Sign-in email for a brand-new account (GoTrue "Confirm signup" template).

  Supabase splits these: signInWithOtp sends the Magic Link template to an address
  it already knows and this one the first time it sees an address. Both are the same
  moment to a student, so the copy matches. Code only, no sign-in link — see
  magic-link.html for why. Keep this file and magic-link.html in step.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f4f1ea; color: #211d21; padding: 32px 16px;">
  <div style="max-width: 460px; margin: 0 auto; background-color: #fffdf8; border: 1px solid #e4ded2; border-radius: 16px; padding: 32px;">
    <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 600; color: #211d21;">Your sign-in code</h1>
    <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: #5b555b;">
      Enter this code on the sign-in screen you already have open. It creates your free account and keeps your assessment.
    </p>

    <p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; letter-spacing: 8px; font-weight: 600; color: #6a2b57;">
      {{ .Token }}
    </p>
    <p style="margin: 0 0 28px; font-size: 13px; color: #857f85;">This code expires in one hour.</p>

    <p style="margin: 0; padding-top: 20px; border-top: 1px solid #e4ded2; font-size: 13px; line-height: 1.55; color: #857f85;">
      Didn't ask for this? You can ignore this email — no account is created until the code is used.
    </p>
  </div>
</div>
