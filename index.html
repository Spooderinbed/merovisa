  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
/* ============================================================
   MyVisa — design tokens + base
   Calm authority: warm paper, deep teal, flat surfaces, thin borders.
   ============================================================ */

:root {
  --font-sans: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;
  --maxw: 1120px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

:root,
[data-theme="light"] {
  --bg:        #f6f5f1;
  --bg-tint:   #efeee8;
  --surface:   #fffefb;
  --surface-2: #faf9f5;
  --ink:       #1d1c19;
  --ink-soft:  #56544d;
  --ink-faint: #8a877d;
  --line:      #1d1c190f;
  --line-2:    #1d1c191a;
  --primary:        #0f5e54;
  --primary-ink:    #0c4a42;
  --primary-tint:   #0f5e5414;
  --primary-tint-2: #0f5e5424;
  --on-primary:     #fcfdfb;
  --accent:      #b07d22;
  --accent-tint: #b07d2218;
  --strong:      #1f6d4a;
  --strong-tint: #1f6d4a16;
  --possible:      #b07d22;
  --possible-tint: #b07d2216;
  --reach:      #b1503a;
  --reach-tint: #b1503a16;
  --shadow: none;
}

[data-theme="dark"] {
  --bg:        #111210;
  --bg-tint:   #181915;
  --surface:   #1a1b17;
  --surface-2: #201f1b;
  --ink:       #ece9e0;
  --ink-soft:  #a8a59b;
  --ink-faint: #76736a;
  --line:      #ffffff12;
  --line-2:    #ffffff20;
  --primary:        #4eb39f;
  --primary-ink:    #6fc4b2;
  --primary-tint:   #4eb39f1f;
  --primary-tint-2: #4eb39f30;
  --on-primary:     #08231f;
  --accent:      #d6a24a;
  --accent-tint: #d6a24a22;
  --strong:      #5bbd8c;
  --strong-tint: #5bbd8c20;
  --possible:      #d6a24a;
  --possible-tint: #d6a24a20;
  --reach:      #d8775f;
  --reach-tint: #d8775f20;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background-color: var(--bg);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#root { min-height: 100vh; }

h1, h2, h3, h4 {
  font-weight: 500;
  line-height: 1.18;
  letter-spacing: -0.012em;
  margin: 0;
  text-wrap: balance;
}

p { margin: 0; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--primary-tint-2); }

.display { font-size: clamp(38px, 5.4vw, 62px); line-height: 1.06; letter-spacing: -0.025em; }
.h1 { font-size: clamp(30px, 3.6vw, 42px); }
.h2 { font-size: clamp(24px, 2.4vw, 30px); }
.h3 { font-size: 21px; }
.lead { font-size: clamp(18px, 1.5vw, 21px); color: var(--ink-soft); line-height: 1.55; }
.body { font-size: 17px; color: var(--ink-soft); }
.small { font-size: 15px; color: var(--ink-soft); }

.mono {
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: 0.02em;
  color: var(--ink-faint);
}
.mono-up { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11.5px; }
.measure { max-width: 60ch; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
.wrap-narrow { max-width: 720px; margin: 0 auto; padding: 0 28px; }

.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-1 { gap: 6px; } .gap-2 { gap: 10px; } .gap-3 { gap: 16px; }
.gap-4 { gap: 24px; } .gap-5 { gap: 36px; }
.between { justify-content: space-between; }
.center { justify-content: center; }
.middle { align-items: center; }
.wgrow { flex: 1; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.card-pad { padding: 24px; }
.hairline { height: 1px; background: var(--line); border: 0; margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border-radius: var(--r-pill);
  border: 1px solid transparent;
  font-size: 16px; font-weight: 500;
  padding: 12px 22px;
  transition: background .18s var(--ease), border-color .18s var(--ease),
              color .18s var(--ease), transform .18s var(--ease), opacity .18s var(--ease);
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--bg-tint); border-color: var(--ink-faint); }
.btn-quiet { background: transparent; color: var(--ink-soft); padding: 10px 14px; }
.btn-quiet:hover { color: var(--ink); background: var(--bg-tint); }
.btn-lg { font-size: 17px; padding: 15px 28px; }
.btn-sm { font-size: 14px; padding: 8px 15px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-full { width: 100%; }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 500;
  padding: 5px 12px; border-radius: var(--r-pill);
  border: 1px solid var(--line-2); color: var(--ink-soft);
  background: var(--surface);
}
.chip-mono { font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: .01em; }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.tag {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; padding: 4px 11px; border-radius: var(--r-pill);
}
.tag-strong   { background: var(--strong-tint);   color: var(--strong); }
.tag-possible { background: var(--possible-tint); color: var(--possible); }
.tag-reach    { background: var(--reach-tint);    color: var(--reach); }
.tag-primary  { background: var(--primary-tint);  color: var(--primary); }
.tag-neutral  { background: var(--bg-tint);       color: var(--ink-soft); }

.bar-track {
  height: 8px; border-radius: var(--r-pill);
  background: var(--bg-tint); overflow: hidden; width: 100%;
}
.bar-fill { height: 100%; border-radius: var(--r-pill); transition: width .9s var(--ease); }

.field {
  width: 100%; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 13px 15px; font-family: inherit; font-size: 16px;
  transition: border-color .15s var(--ease), background .15s var(--ease);
}
.field:focus { outline: none; border-color: var(--primary); }
.field::placeholder { color: var(--ink-faint); }

.opt {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-md); padding: 17px 19px;
  transition: border-color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
}
.opt:hover { border-color: var(--ink-faint); }
.opt[data-sel="true"] {
  border-color: var(--primary); background: var(--primary-tint);
}
.opt-mark {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 1.5px solid var(--line-2);
  display: grid; place-items: center;
  transition: border-color .15s var(--ease), background .15s var(--ease);
}
.opt[data-sel="true"] .opt-mark { border-color: var(--primary); background: var(--primary); }

input[type="range"].slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px; border-radius: var(--r-pill);
  background: var(--bg-tint); outline: none;
}
input[type="range"].slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--primary);
  cursor: pointer; transition: transform .12s var(--ease);
}
input[type="range"].slider::-webkit-slider-thumb:active { transform: scale(1.08); }
input[type="range"].slider::-moz-range-thumb {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--primary); cursor: pointer;
}

.ph {
  position: relative; overflow: hidden;
  background-color: var(--bg-tint);
  background-image: repeating-linear-gradient(-45deg, transparent 0 9px, var(--line) 9px 10px);
  display: grid; place-items: center;
}
.ph span {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-faint); background: var(--surface);
  padding: 3px 8px; border-radius: var(--r-pill); border: 1px solid var(--line);
}

.flag {
  width: 30px; height: 22px; border-radius: 4px; flex: none;
  border: 1px solid var(--line-2); overflow: hidden;
  display: grid; place-items: center; font-size: 14px;
  background: var(--bg-tint);
}

.appbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.navlink {
  font-size: 15px; color: var(--ink-soft); padding: 8px 4px;
  position: relative; transition: color .15s var(--ease);
}
.navlink:hover { color: var(--ink); }
.navlink[data-active="true"] { color: var(--ink); font-weight: 500; }
.navlink[data-active="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--primary); border-radius: 2px;
}

.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; flex: none;
}

.fade-in { animation: fade .5s var(--ease) both; }
.rise-in { animation: rise .55s var(--ease) both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.icon { display: inline-flex; flex: none; }
.icon svg { display: block; }

.divider-soft { border-top: 1px solid var(--line); }

.seg { display: inline-flex; background: var(--bg-tint); border-radius: var(--r-pill); padding: 4px; gap: 4px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-soft);
  font-size: 14px; font-weight: 500; padding: 7px 16px; border-radius: var(--r-pill);
  transition: all .15s var(--ease);
}
.seg button[data-on="true"] { background: var(--surface); color: var(--ink); }

* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex: none;
  background: var(--primary-tint); color: var(--primary);
  display: grid; place-items: center; font-weight: 500; font-size: 15px;
  border: 1px solid var(--line);
}

@media (max-width: 860px) {
  body { font-size: 16px; }
  .wrap, .wrap-narrow { padding: 0 20px; }
  .hide-mobile { display: none !important; }
  .cc-top { grid-template-columns: 1fr !important; }
  .cc-standing { grid-template-columns: 1fr !important; }
  .cc-traj { grid-auto-flow: row; grid-template-columns: 1fr 1fr !important; gap: 18px !important; }
  .cc-traj > div > span[style*="position: absolute"] { display: none; }
}
  </style>

  <script>
/* scoring engine (window.Engine) — rule-based for MVP */
window.Engine = (function () {
  const clamp = (n, lo = 4, hi = 98) => Math.max(lo, Math.min(hi, Math.round(n)));
  const TYPICAL = { au: 60000, ca: 48000, uk: 42000, de: 16000, us: 70000, ie: 32000 };

  function bandOf(x) { return x >= 72 ? "strong" : x >= 50 ? "possible" : "reach"; }

  function merged(data) {
    const p = (window.DB && DB.profile) || {};
    return { p, d: data || {} };
  }

  function gradePercent(d) {
    return typeof d.grade === "number" ? d.grade : 70;
  }

  function computeScores(data) {
    const { p, d } = merged(data);
    const dest = d.destination || "au";
    const grade = gradePercent(d);
    const ielts = p.english?.overall ?? d.ielts ?? 0;
    const englishNorm = ielts ? (ielts / 9) * 100 : 45;
    let academic = grade * 0.7 + englishNorm * 0.3 - (p.academic?.backlogs || 0) * 3 + (p.academic?.distinctions ? 5 : 0);

    const typical = TYPICAL[dest] || 45000;
    const budget = d.budget ?? p.finance?.total ?? 30000;
    const sponsor = (d.sponsor || p.finance?.sponsor || "").toLowerCase();
    let sponsorBonus = 0;
    if (sponsor.includes("loan")) sponsorBonus += 5;
    if (sponsor.includes("parent") || sponsor.includes("family")) sponsorBonus += 4;
    if (sponsor.includes("self")) sponsorBonus += 6;
    let financial = (budget / typical) * 78 + sponsorBonus + (p.finance?.proofUploaded ? 7 : -4);

    let visa = 64;
    if (d.hasGap ?? p.gap?.has) {
      const reasons = d.gapReasons || p.gap?.reasons || [];
      visa += reasons.length ? 12 : -10;
      const evidence = p.gap?.evidence || [];
      visa += evidence.length ? 6 : -8;
    } else { visa += 8; }
    visa += (p.visaHistory?.refusals === "None") ? 12 : -14;
    visa += p.visaHistory?.travelled ? 6 : -2;
    visa += p.work?.docs ? 5 : -5;

    let profile = 35;
    if (p.work?.title) profile += p.work.relevance === "Directly related" ? 18 : 10;
    if (p.academic?.research) profile += 10;
    if ((p.scholarshipProfile || []).length) profile += (p.scholarshipProfile.length) * 5;
    if (p.academic?.publications) profile += 8;

    const s = {
      academic: clamp(academic), financial: clamp(financial),
      visa: clamp(visa), profile: clamp(profile),
    };

    const overall = s.academic * 0.3 + s.financial * 0.25 + s.visa * 0.3 + s.profile * 0.15;
    let band = bandOf(overall);
    const curated = window.DB && DB.countryById(dest)?.match;
    if (curated === "strong" && band === "possible") band = "strong";
    if (curated === "reach" && band !== "reach") band = "possible";

    return {
      scores: s,
      bands: { academic: bandOf(s.academic), financial: bandOf(s.financial), visa: bandOf(s.visa), profile: bandOf(s.profile) },
      band, overall: Math.round(overall),
      country: window.DB ? DB.countryById(dest) : null,
    };
  }

  function visaAnalysis(data) {
    const { p, d } = merged(data);
    const strengths = [], concerns = [], missing = [];
    if ((p.visaHistory?.refusals || "None") === "None") strengths.push("No previous visa refusals on record");
    else concerns.push("Previous refusal (" + p.visaHistory.refusals + ") must be addressed directly");
    const hasGap = d.hasGap ?? p.gap?.has;
    if (hasGap) {
      const reasons = d.gapReasons || p.gap?.reasons || [];
      if (reasons.length) strengths.push("Study gap is explainable — " + reasons.join(", ").toLowerCase());
      else concerns.push("Study gap has no stated reason yet");
      if (!(p.gap?.evidence || []).length) missing.push("Evidence for your study gap (employment letter, etc.)");
    } else { strengths.push("No study gap to explain"); }
    if (p.work?.title && !p.work?.docs) missing.push("Employment reference / experience letter");
    if (!p.finance?.proofUploaded) missing.push("Proof of funds document");
    if (!p.english?.reportUploaded) missing.push("Official English test report");
    if (p.visaHistory?.travelled === false || p.visaHistory?.travelled == null) concerns.push("No international travel history to show ties");
    const budget = d.budget ?? p.finance?.total ?? 0;
    const c = window.DB && DB.countryById(d.destination || "au");
    if (c && budget) {
      const typical = TYPICAL[c.id] || 45000;
      if (budget < typical * 0.7) concerns.push("Budget is below the typical cost for " + c.name);
      else strengths.push("Budget is in a workable range for your destination");
    }
    return { strengths, concerns, missing };
  }

  function completeness() {
    const secs = (window.DB && DB.profileSections) || [];
    const w = { done: 1, partial: 0.5, empty: 0 };
    const sum = secs.reduce((a, s) => a + (w[s.status] ?? 0), 0);
    const pct = secs.length ? Math.round((sum / secs.length) * 100) : 0;
    const done = secs.filter(s => s.status === "done").length;
    const partial = secs.filter(s => s.status === "partial").length;
    const empty = secs.filter(s => s.status === "empty").length;
    return { pct, done, partial, empty, total: secs.length };
  }

  return { computeScores, visaAnalysis, completeness, bandOf };
})();

/* ---------- wizard.jsx ---------- */
const HOME_COUNTRIES = [{ v: "Nepal", flag: "🇳🇵" }, { v: "India", flag: "🇮🇳" }, { v: "Nigeria", flag: "🇳🇬" }, { v: "Pakistan", flag: "🇵🇰" }, { v: "Bangladesh", flag: "🇧🇩" }, { v: "Other", flag: "🌐" }];
const GRADE_SYSTEMS = { Nepal: ["Percentage (Nepal)", "CGPA-4"], India: ["Percentage (India)", "CGPA-10"], Nigeria: ["CGPA-5", "Percentage"], default: ["Percentage", "CGPA-4", "CGPA-10", "CGPA-5"] };
const LEVELS = ["Higher secondary (+2)", "Bachelor's degree", "Master's degree"];
const GAP_REASONS = [["briefcase", "Worked or interned"], ["doc", "Retook or improved exams"], ["user", "Health or family reasons"], ["spark", "Started something of my own"]];
const SPONSORS = ["Self-funded", "Parents / family", "Education loan", "Mixed"];
const GOALS = [["match", "Permanent residency", "Settle long-term after study"], ["coins", "Lowest total cost", "Best value for money"], ["cap", "Highest-ranked university", "Prestige and brand"], ["clock", "Fastest admission", "Start as soon as possible"], ["briefcase", "Best employment outcomes", "Strong job prospects"], ["spark", "Research opportunities", "Academic and research depth"]];

function Wizard({ go, onComplete, layout = "steps", initial }) {
  const [data, setData] = useState(initial || { homeCountry: "Nepal", level: "Bachelor's degree", gradeSystem: "Percentage (Nepal)", grade: 72, englishStatus: "Taken", ielts: 7.0, hasGap: true, gapYears: 1, gapReasons: ["Worked or interned"], destination: "au", budget: 38000, sponsor: "Education loan", goal: "Permanent residency" });
  const set = (k, v) => setData(d => ({ ...d, [k]: v }));
  if (layout === "grouped") return <WizardGrouped {...{ data, set, go, onComplete }} />;
  return <WizardSteps {...{ data, set, go, onComplete }} />;
}

function WizardSteps({ data, set, go, onComplete }) {
  const [step, setStep] = useState(0);
  const steps = ["home", "education", "english", "gap", ...(data.hasGap ? ["gapDetail"] : []), "destination", "budget", "goal"];
  const total = steps.length;
  const key = steps[step];
  const next = () => step < total - 1 ? setStep(step + 1) : onComplete(data);
  const back = () => step > 0 ? setStep(step - 1) : go("home");
  return (
    <div className="wrap-narrow fade-in" style={{ paddingTop: 40, paddingBottom: 80, minHeight: "calc(100vh - 66px)" }}>
      <div className="row between middle" style={{ marginBottom: 36 }}>
        <button className="btn-quiet row gap-2 middle" onClick={back} style={{ borderRadius: "var(--r-pill)" }}><Icon name="arrowLeft" size={17} /> Back</button>
        <span className="mono">step {step + 1} of {total}</span>
      </div>
      <ProgressDots total={total} current={step} />
      <div key={key} className="rise-in" style={{ marginTop: 40 }}><StepBody k={key} data={data} set={set} /></div>
      <div className="row between middle" style={{ marginTop: 44 }}>
        <button className="btn-quiet" onClick={() => go("home")}>Save & exit</button>
        <button className="btn btn-primary btn-lg" onClick={next}>{step === total - 1 ? <>See where I stand <Icon name="arrowRight" size={18} /></> : <>Continue <Icon name="arrowRight" size={18} /></>}</button>
      </div>
    </div>
  );
}

function ProgressDots({ total, current }) {
  return <div className="row gap-2" style={{ width: "100%" }}>{Array.from({ length: total }).map((_, i) => <div key={i} className="bar-track" style={{ height: 5, background: i <= current ? "var(--primary)" : "var(--bg-tint)", transition: "background .3s var(--ease)" }} />)}</div>;
}

function StepBody({ k, data, set }) {
  if (k === "home") return <StepShell title="Where are you from?" sub="This sets your grade scale and which visa rules we show you."><div className="col gap-2">{HOME_COUNTRIES.map(c => <button key={c.v} className="opt" data-sel={String(data.homeCountry === c.v)} onClick={() => { set("homeCountry", c.v); set("gradeSystem", (GRADE_SYSTEMS[c.v] || GRADE_SYSTEMS.default)[0]); }}><Flag emoji={c.flag} /><span className="wgrow" style={{ fontWeight: 500 }}>{c.v}</span><Mark on={data.homeCountry === c.v} /></button>)}</div></StepShell>;

  if (k === "education") return (
    <StepShell title="Your education" sub="Enter your result in your own grade system — we convert it for each destination.">
      <FieldLabel>Latest level completed</FieldLabel>
      <div className="col gap-2" style={{ marginBottom: 24 }}>{LEVELS.map(l => <button key={l} className="opt" data-sel={String(data.level === l)} onClick={() => set("level", l)}><Icon name="cap" size={19} style={{ color: data.level === l ? "var(--primary)" : "var(--ink-faint)" }} /><span className="wgrow" style={{ fontWeight: 500 }}>{l}</span><Mark on={data.level === l} /></button>)}</div>
      <FieldLabel>Grade system</FieldLabel>
      <div className="seg" style={{ marginBottom: 22, flexWrap: "wrap" }}>{(GRADE_SYSTEMS[data.homeCountry] || GRADE_SYSTEMS.default).map(g => <button key={g} data-on={String(data.gradeSystem === g)} onClick={() => set("gradeSystem", g)}>{g}</button>)}</div>
      <FieldLabel>Your latest result</FieldLabel>
      <GradeInput system={data.gradeSystem} value={data.grade} onChange={v => set("grade", v)} />
    </StepShell>
  );

  if (k === "english") {
    const taken = data.englishStatus === "Taken";
    return (
      <StepShell title="English proficiency" sub="Most destinations need proof of English. Even a planned test helps us tailor your matches.">
        <FieldLabel>Where are you with an English test?</FieldLabel>
        <div className="seg" style={{ marginBottom: taken ? 24 : 0 }}>{["Not taken", "Booked", "Taken"].map(s => <button key={s} data-on={String(data.englishStatus === s)} onClick={() => set("englishStatus", s)}>{s}</button>)}</div>
        {taken && (
          <div className="card card-pad col gap-4">
            <FieldLabel>IELTS overall band (or equivalent)</FieldLabel>
            <div className="row center" style={{ alignItems: "baseline", gap: 6 }}><span style={{ fontSize: 44, fontWeight: 500 }}>{Number(data.ielts).toFixed(1)}</span><span className="body">/ 9.0</span></div>
            <input type="range" className="slider" min="4" max="9" step="0.5" value={data.ielts} onChange={e => set("ielts", +e.target.value)} />
            <p className="small" style={{ textAlign: "center", color: "var(--ink-faint)" }}>You can add per-section scores later in your profile.</p>
          </div>
        )}
      </StepShell>
    );
  }

  if (k === "gap") return <StepShell title="Any gap in your studies?" sub="A gap is completely normal. Explaining it well actually strengthens your visa case."><div className="col gap-2">{[["No gap", false], ["Yes, there's a gap", true]].map(([label, val]) => <button key={label} className="opt" data-sel={String(data.hasGap === val)} onClick={() => set("hasGap", val)}><span className="wgrow" style={{ fontWeight: 500 }}>{label}</span><Mark on={data.hasGap === val} /></button>)}</div></StepShell>;

  if (k === "gapDetail") return (
    <StepShell title="What were you doing?" sub="Pick all that apply. We'll help you turn this into a clear statement later.">
      <FieldLabel>How long was the gap?</FieldLabel>
      <div className="seg" style={{ marginBottom: 24 }}>{[1, 2, 3].map(y => <button key={y} data-on={String(data.gapYears === y)} onClick={() => set("gapYears", y)}>{y} {y === 1 ? "year" : "years"}{y === 3 ? "+" : ""}</button>)}</div>
      <FieldLabel>Reasons</FieldLabel>
      <div className="col gap-2">{GAP_REASONS.map(([ic, label]) => { const on = data.gapReasons.includes(label); return <button key={label} className="opt" data-sel={String(on)} onClick={() => set("gapReasons", on ? data.gapReasons.filter(r => r !== label) : [...data.gapReasons, label])}><Icon name={ic} size={19} style={{ color: on ? "var(--primary)" : "var(--ink-faint)" }} /><span className="wgrow" style={{ fontWeight: 500 }}>{label}</span><span className="opt-mark" style={{ borderRadius: 6 }}>{on && <Icon name="check" size={14} style={{ color: "var(--on-primary)" }} />}</span></button>; })}</div>
    </StepShell>
  );

  if (k === "destination") return <StepShell title="Where do you want to study?" sub="You can compare others later — pick the one you're most curious about."><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>{DB.countries.map(c => <button key={c.id} className="opt" data-sel={String(data.destination === c.id)} onClick={() => set("destination", c.id)} style={{ padding: "16px 18px" }}><Flag emoji={c.flag} /><span className="wgrow" style={{ fontWeight: 500 }}>{c.name}</span><Mark on={data.destination === c.id} /></button>)}</div></StepShell>;

  if (k === "budget") {
    const c = DB.countryById(data.destination);
    return (
      <StepShell title="Your yearly budget" sub="Tuition plus living costs, per year, in USD. A rough figure is fine.">
        <div className="card card-pad col gap-4">
          <div className="row center" style={{ alignItems: "baseline", gap: 4 }}><span style={{ fontSize: 44, fontWeight: 500, letterSpacing: "-0.02em" }}>${data.budget.toLocaleString()}</span><span className="body">/ year</span></div>
          <input type="range" className="slider" min="8000" max="80000" step="1000" value={data.budget} onChange={e => set("budget", +e.target.value)} />
          <div className="row between mono"><span>$8k</span><span>$80k</span></div>
          <p className="small row gap-2 middle" style={{ justifyContent: "center", color: "var(--ink-faint)" }}><Icon name="coins" size={15} /> Typical for {c.name}: {c.tuitionRange.replace(" / yr", "")} tuition + living</p>
        </div>
        <div style={{ marginTop: 24 }}>
          <FieldLabel>How will you fund this?</FieldLabel>
          <div className="row gap-2" style={{ flexWrap: "wrap" }}>{SPONSORS.map(s => <button key={s} className="chip" data-sel={String(data.sponsor === s)} onClick={() => set("sponsor", s)} style={{ cursor: "pointer", borderColor: data.sponsor === s ? "var(--primary)" : "var(--line-2)", background: data.sponsor === s ? "var(--primary-tint)" : "var(--surface)", color: data.sponsor === s ? "var(--primary)" : "var(--ink-soft)" }}>{s}</button>)}</div>
        </div>
      </StepShell>
    );
  }

  if (k === "goal") return <StepShell title="What matters most to you?" sub="This shapes how we rank your matches — the same profile sorts differently for different goals."><div className="col gap-2">{GOALS.map(([ic, label, sub]) => <button key={label} className="opt" data-sel={String(data.goal === label)} onClick={() => set("goal", label)}><Icon name={ic} size={20} style={{ color: data.goal === label ? "var(--primary)" : "var(--ink-faint)" }} /><div className="col wgrow"><span style={{ fontWeight: 500 }}>{label}</span><span className="small" style={{ color: "var(--ink-faint)" }}>{sub}</span></div><Mark on={data.goal === label} /></button>)}</div></StepShell>;
  return null;
}

function StepShell({ title, sub, children }) { return <div className="col gap-3"><h2 className="h1">{title}</h2><p className="lead" style={{ marginBottom: 14 }}>{sub}</p>{children}</div>; }
function FieldLabel({ children }) { return <span className="mono-up mono" style={{ display: "block", marginBottom: 10 }}>{children}</span>; }
function Mark({ on }) { return <span className="opt-mark">{on && <span style={{ width: 9, height: 9, borderRadius: "50%", background: "var(--on-primary)" }} />}</span>; }

function GradeInput({ system, value, onChange }) {
  const isPct = system.toLowerCase().includes("percent");
  const max = isPct ? 100 : system.includes("10") ? 10 : system.includes("5") ? 5 : 4;
  const unit = isPct ? "%" : ("/ " + max);
  return (
    <div className="card card-pad col gap-4">
      <div className="row center" style={{ alignItems: "baseline", gap: 6 }}><span style={{ fontSize: 44, fontWeight: 500 }}>{isPct ? value : (value / 100 * max).toFixed(2)}</span><span className="body">{unit}</span></div>
      <input type="range" className="slider" min={isPct ? 40 : 0} max={isPct ? 100 : 100} step="1" value={value} onChange={e => onChange(+e.target.value)} />
      <p className="small" style={{ textAlign: "center", color: "var(--ink-faint)" }}>Drag to your latest {isPct ? "percentage" : "grade"} — you can refine it later.</p>
    </div>
  );
}

function WizardGrouped({ data, set, go, onComplete }) {

function scoreNote(k, data, e) {
  const c = e.country;
  if (k === "academic") return DB.gradeConversion[c.name]?.[data.gradeSystem]?.[data.grade] || ("grade + IELTS " + (data.ielts ?? "—"));
  if (k === "financial") return "$" + (data.budget ?? 38000).toLocaleString() + "/yr vs " + c.tuitionRange;
  if (k === "visa") return !data.hasGap ? "no gap · no refusals" : data.gapYears + "yr gap · explained";
  if (k === "profile") return DB.profile.work.duration + " work · add more";
  return "";
}

/* ---------- app.jsx — router & theme ---------- */
const PRIMARY_PRESETS = {
  teal:  { c: "#0f5e54", ink: "#0c4a42", on: "#fcfdfb", dc: "#4eb39f", dink: "#6fc4b2", don: "#08231f" },
  green: { c: "#1f6d4a", ink: "#185639", on: "#fcfdfb", dc: "#5bbd8c", dink: "#7bcda4", don: "#072019" },
  blue:  { c: "#1b4f72", ink: "#143b56", on: "#fcfdfb", dc: "#5b9bc9", dink: "#7fb3d6", don: "#08202e" },
  plum:  { c: "#5b3a6e", ink: "#472d56", on: "#fcfdfb", dc: "#a984c0", dink: "#bb9bce", don: "#1e1226" },
};

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + a + ")";
}

function applyTheme(t) {
  const root = document.documentElement;
  root.setAttribute("data-theme", t.dark ? "dark" : "light");
  const p = PRIMARY_PRESETS[t.primary] || PRIMARY_PRESETS.teal;
  const c = t.dark ? p.dc : p.c, ink = t.dark ? p.dink : p.ink, on = t.dark ? p.don : p.on;
  root.style.setProperty("--primary", c);
  root.style.setProperty("--primary-ink", ink);
  root.style.setProperty("--on-primary", on);
  root.style.setProperty("--primary-tint", hexA(c, t.dark ? 0.16 : 0.08));
  root.style.setProperty("--primary-tint-2", hexA(c, t.dark ? 0.28 : 0.16));
}

function App() {
  const [dark, setDark] = useState(false);
  const [view, setView] = useState("home");
  const [profile, setProfile] = useState(null);
  const [loggedIn, setLoggedIn] = useState(false);
  const [homeLayout, setHomeLayout] = useState("command");
  const [verdictStyle, setVerdictStyle] = useState("scale");
  const [wizardLayout, setWizardLayout] = useState("steps");

  useEffect(() => { applyTheme({ dark, primary: "teal" }); }, [dark]);

  const go = (v) => { setView(v); window.scrollTo({ top: 0 }); };
  const toggleTheme = () => setDark(!dark);

  const standalonePages = { wizard: 1, results: 1, auth: 1 };
  const focused = standalonePages[view];

  let page;
  if (view === "home") page = <Home go={go} />;
  else if (view === "wizard") page = <Wizard go={go} layout={wizardLayout} initial={profile} onComplete={(d) => { setProfile(d); go("results"); }} />;
  else if (view === "results") page = <Results go={go} data={profile} variant={verdictStyle} onSave={(d) => { setProfile(d); go("auth"); }} />;
  else if (view === "auth") page = <Auth go={go} onAuthed={() => { setLoggedIn(true); go("dashboard"); }} />;
  else if (view === "dashboard") page = homeLayout === "feed" ? <Dashboard go={go} data={profile} /> : <CommandCentre go={go} data={profile} />;
  else if (view === "guide") page = <Guide go={go} />;
  else if (view === "checklist") page = <Checklist go={go} />;
  else if (view === "matches") page = <Matches go={go} />;
  else if (view === "plan") page = <Plan go={go} data={profile} />;
  else if (view === "profile") page = <Profile go={go} />;
  else if (view === "destinations") page = <Destinations go={go} />;
  else page = <Home go={go} />;

  return (
    <>
      {!focused && <AppBar view={view} go={go} loggedIn={loggedIn} dark={dark} onToggleTheme={toggleTheme} />}
      {focused && <FocusBar go={go} dark={dark} onToggleTheme={toggleTheme} />}
      <main>{page}</main>
      {(view === "home" || view === "destinations" || view === "checklist") && <Footer go={go} />}

      {/* floating settings toggle */}
      <div style={{ position: "fixed", bottom: 20, right: 20, zIndex: 100, display: "flex", gap: 8, flexDirection: "column" }}>
        <select value={homeLayout} onChange={e => setHomeLayout(e.target.value)} style={{ padding: "6px 10px", borderRadius: 8, border: "1px solid var(--line-2)", background: "var(--surface)", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, cursor: "pointer" }}>
          <option value="command">Command centre</option>
          <option value="feed">Feed dashboard</option>
        </select>
        <select value={verdictStyle} onChange={e => setVerdictStyle(e.target.value)} style={{ padding: "6px 10px", borderRadius: 8, border: "1px solid var(--line-2)", background: "var(--surface)", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, cursor: "pointer" }}>
          <option value="scale">Verdict: Scale</option>
          <option value="card">Verdict: Card</option>
        </select>
        <select value={wizardLayout} onChange={e => setWizardLayout(e.target.value)} style={{ padding: "6px 10px", borderRadius: 8, border: "1px solid var(--line-2)", background: "var(--surface)", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, cursor: "pointer" }}>
          <option value="steps">Wizard: Steps</option>
          <option value="grouped">Wizard: Grouped</option>
        </select>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
